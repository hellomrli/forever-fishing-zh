[workspace]
members = ["crates/foreverfish"]
resolver = "2"

[workspace.package]
version = "2.0.0-alpha.5"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/hellomrli/forever-fishing-zh"
authors = ["hellomrli", "Richard Franklin (original algorithms and assets)"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
