# Forever 钓鱼助手配置。界面保存会保留注释；文件统一使用 UTF-8。

[game]
# 动作条上的钓鱼技能键。
cast_key = "1"
# 游戏中“与目标互动”的按键。
interact_key = "f"
# 会话时限（分钟）；0 表示不限时。
session_minutes = 0
# 可选：动作条上包含 /quit 的宏键。
quit_key = ""
# 可选：使用鱼饵并执行 /use 16 的宏键。
lure_key = ""
# 鱼饵持续时间（分钟）。
lure_minutes = 10.0
# 留空自动发现中文和英文客户端；也可填写自定义窗口标题。
window_title = ""
# Windows 全局快捷键；只能使用 F1–F12，留空关闭，不能与动作键冲突。
pause_hotkey = "f8"
stop_hotkey = "f9"

[vision]
# 图标尺寸；0 表示自动校准。
icon_size_px = 0
icon_native_size = 0
icon_threshold = 0.75
# 小图标自动保留足够分辨率，避免缩图后丢失细节。
match_width = 1920
# 同时检查自己浮漂附近的画面变化，减少其他玩家水花的干扰。
confirm_bite = true
# 听到水花后继续等待画面确认的时间（秒）。
confirm_window_s = 0.6
# 最低局部画面变化分数。
motion_threshold = 8.0
# 识别范围，使用窗口宽高比例；诊断页支持拖动框选。
search_left = 0.0
search_top = 0.0
search_right = 1.0
search_bottom = 1.0

[audio]
# game：选中客户端的声音；device：系统回环设备。
capture = "game"
# 回环设备名称或 ID；留空使用默认输出设备。
device = ""
bite_threshold = 0.66
refractory_s = 3.0
# Windows 进程捕获不可用时使用系统回环，并显示实际来源。
fallback_to_device = true

[run]
icon_timeout_s = 4.0
cast_timeout_s = 30.0
loot_timeout_s = 3.0
pause_min_s = 0.5
pause_max_s = 2.0
key_hold_ms = 60
lure_cast_s = 6.0
# 状态检查间隔（秒），可以被“停止”立即中断。
tick_interval_s = 0.02
# 收杆后图标连续消失的最短确认时间（秒），同时要求连续多帧。
loot_confirm_s = 0.4

[behavior]
# 以下可选行为默认关闭。
break_every_min_minutes = 0.0
break_every_max_minutes = 0.0
break_min_minutes = 0.0
break_max_minutes = 0.0
reaction_min_ms = 0
reaction_max_ms = 0
skip_bite_chance = 0.0
key_hold_jitter_ms = 0
jump_chance = 0.0
jump_key = "space"
