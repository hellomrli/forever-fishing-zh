name: Release Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      FOREVERFISH_HOME: ${{ github.workspace }}/.foreverfish-home
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Check version, assets, lint and tests
        run: |
          uv run python scripts/check_release.py
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -v --junitxml=checks/tests.xml
      - name: Build native Windows EXEs
        run: uv run pyinstaller --clean --noconfirm packaging/wowfish.spec
      - name: Verify the built GUI and console
        shell: pwsh
        run: |
          $report = Join-Path $env:GITHUB_WORKSPACE 'checks/windows-exe.json'
          New-Item -ItemType Directory -Force (Split-Path $report) | Out-Null
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist/ForeverFishing.exe'
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test `"$report`"" -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process | Stop-Process -Force
            throw 'The built GUI self-test timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Built GUI exited with code $($process.ExitCode)" }
          $result = Get-Content $report -Raw -Encoding utf8 | ConvertFrom-Json
          if (-not $result.ok -or -not $result.frozen) { throw 'Built GUI verification failed' }
          Get-Content $report -Raw -Encoding utf8
          & .\dist\ForeverFishing-CLI.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & .\dist\ForeverFishing-CLI.exe doctor
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Portable archive and SHA256
        run: uv run python scripts/package_release.py
      - name: Upload release files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-release
          path: dist/
          if-no-files-found: error
      - name: Upload verification
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-verification
          path: checks/
          if-no-files-found: warn

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: windows-release
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.zip dist/SHA256SUMS.txt dist/BUILD_INFO.txt \
            --verify-tag --title "Forever 钓鱼助手 $GITHUB_REF_NAME" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
